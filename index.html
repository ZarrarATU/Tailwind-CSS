<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tailwind</title>
  <style>
    body {
      background: #333;
      color: white;
      margin: 0;
      padding: 0;
      /* width: 100vw;
        height: 100vh; */
    }

    .main {
      background: #111;
      display: grid;
      gap: 10px;
      /* width: 100%;
        height: 100%; */
      padding: 20px;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 200px);
    }

    .card {
      /* width: 200px; */
      /* height: 200px; */
      background: #221;
      border: 1px solid white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: monospace;
      font-size: 20px
    }

    .header {
      grid-column-start: 1;
      grid-column-end: 5;
    }

    .footer {
      grid-column-start: -5;
      grid-column-end: -1;
    }

    .side-bar {
      grid-row-start: 2;
      grid-row-end: 4;
    }

    .content-1 {
      grid-column-start: 2;
      grid-column-end: 5;
    }

    .content-3 {
      grid-column-start: 3;
      grid-column-end: 5;
    }
  </style>
</head>

<body>

  <div class="main">
    <div class="card1 header card">HEADER</div>
    <div class="card2 side-bar card">SIDE-BAR</div>
    <div class="card3 content-1 card">CONTENT-1</div>
    <div class="card4 content-2 card">CONTENT-2</div>
    <div class="card5 content-3 card">CONTNET-3</div>
    <div class="card8 footer card">FOOTER</div>
  </div>

  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
